variables:
  REGISTRY: registry.dockerbuch.info
  TEST_IMAGE: $REGISTRY/dockerbuch/webpage:$CI_COMMIT_REF_NAME
  TEST_NETWORK: testnetwork
  RELEASE_IMAGE: $REGISTRY/dockerbuch/webpage:latest
  TEST_CONTAINER_NAME: dockerbuch
  LINK_CHECKER: $REGISTRY/dockerbuch/webpage/linkchecker
  VALIDATOR: $REGISTRY/dockerbuch/webpage/validator

stages:
  - build
  - setupTest
  - test
  - lighthouse
  - cleanupTest
  - release

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY

build:
  stage: build
  tags:
    - shellRunner
  script:
    - pwd
    - ls -l ./ /
    - docker build -t $TEST_IMAGE .
    - docker push $TEST_IMAGE
    - docker build -t $LINK_CHECKER linkchecker/
    - docker push $LINK_CHECKER
    - docker build -t $VALIDATOR validator/
    - docker push $VALIDATOR

setupTest:
  stage: setupTest
  tags:
    - shellRunner
  script:
    - docker pull $TEST_IMAGE
    - docker network create $TEST_NETWORK
    - docker run -d --network $TEST_NETWORK
        --name $TEST_CONTAINER_NAME $TEST_IMAGE

testLinks:
  stage: test
  tags:
    - shellRunner
  script:
    - docker ps
    - docker run --rm --network $TEST_NETWORK $LINK_CHECKER
        http://$TEST_CONTAINER_NAME/ --check-extern

testHTML:
  stage: test
  tags:
    - shellRunner
  script:
    - docker run --volumes-from $TEST_CONTAINER_NAME $VALIDATOR
      --rm --verbose --skip-non-html /usr/share/nginx/html/

lighthouse:
  stage: lighthouse
  tags:
    - shellRunner
  script:
    - |
      # Run Lighthouse audit on the test container
      docker run --rm --network $TEST_NETWORK \
        -v $(pwd):/workspace \
        node:alpine sh -c "
        apk add --no-cache chromium > /dev/null 2>&1
        npm install -g lighthouse > /dev/null 2>&1
        lighthouse http://$TEST_CONTAINER_NAME/ \
          --output=json \
          --output-path=/workspace/lighthouse-report.json \
          --chrome-flags='--headless --no-sandbox --disable-gpu' \
          --only-categories=performance,accessibility
      "
    - |
      # Extract and validate scores
      PERFORMANCE=$(docker run --rm -i \
        -v $(pwd):/workspace \
        node:alpine sh -c "
        apk add --no-cache jq > /dev/null 2>&1
        cat /workspace/lighthouse-report.json | jq -r '.categories.performance.score * 100'
      ")
      ACCESSIBILITY=$(docker run --rm -i \
        -v $(pwd):/workspace \
        node:alpine sh -c "
        apk add --no-cache jq > /dev/null 2>&1
        cat /workspace/lighthouse-report.json | jq -r '.categories.accessibility.score * 100'
      ")
      echo "Performance score: $PERFORMANCE"
      echo "Accessibility score: $ACCESSIBILITY"
      echo "Thresholds: Performance >= 90, Accessibility >= 95"
      # Check thresholds (using awk for floating point comparison)
      if [ $(echo "$PERFORMANCE < 90" | awk '{print ($1 < $2)}') -eq 1 ]; then
        echo "ERROR: Performance score $PERFORMANCE is below threshold of 90"
        exit 1
      fi
      if [ $(echo "$ACCESSIBILITY < 95" | awk '{print ($1 < $2)}') -eq 1 ]; then
        echo "ERROR: Accessibility score $ACCESSIBILITY is below threshold of 95"
        exit 1
      fi
      echo "✓ All Lighthouse thresholds met!"
  artifacts:
    paths:
      - lighthouse-report.json
    expire_in: 30 days
  dependencies:
    - setupTest

cleanupTest:
  stage: cleanupTest
  tags:
    - shellRunner
  script:
    - docker stop $TEST_CONTAINER_NAME
        && docker rm $TEST_CONTAINER_NAME
    - docker network rm $TEST_NETWORK
  when: always

release:
  stage: release
  tags:
    - shellRunner
  script:
    - docker pull $TEST_IMAGE
    - docker tag $TEST_IMAGE $RELEASE_IMAGE
    - docker push $RELEASE_IMAGE
  only:
    - master
