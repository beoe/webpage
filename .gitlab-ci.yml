variables:
  REGISTRY: registry.dockerbuch.info
  TEST_IMAGE: $REGISTRY/dockerbuch/webpage:$CI_COMMIT_REF_NAME
  TEST_NETWORK: testnetwork
  RELEASE_IMAGE: $REGISTRY/dockerbuch/webpage:latest
  TEST_CONTAINER_NAME: dockerbuch
  LINK_CHECKER: $REGISTRY/dockerbuch/webpage/linkchecker
  VALIDATOR: $REGISTRY/dockerbuch/webpage/validator
  LIGHTHOUSE: $REGISTRY/dockerbuch/webpage/lighthouse
  LIGHTHOUSE_PERFORMANCE_THRESHOLD: "80"
  LIGHTHOUSE_ACCESSIBILITY_THRESHOLD: "95"

stages:
  - build
  - setupTest
  - test
  - lighthouse
  - cleanupTest
  - release

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY
  - |
    # Set Docker client timeout for large uploads (30 minutes)
    # Prevents Docker client from timing out before Traefik finishes processing
    export DOCKER_CLIENT_TIMEOUT=1800
    echo "Docker client timeout set to ${DOCKER_CLIENT_TIMEOUT}s (30 minutes)"
  - |
    # Check available disk space before building
    echo "Available disk space:"
    df -h
    echo "Docker disk usage:"
    docker system df || true

build:
  stage: build
  tags:
    - shellRunner
  timeout: 2h
  script:
    - pwd
    - ls -l ./ /
    - docker build -t $TEST_IMAGE .
    - docker push $TEST_IMAGE || (echo "Failed to push $TEST_IMAGE, retrying..." && sleep 5 && docker push $TEST_IMAGE)
    - docker build -t $LINK_CHECKER linkchecker/
    - docker push $LINK_CHECKER || (echo "Failed to push $LINK_CHECKER, retrying..." && sleep 5 && docker push $LINK_CHECKER)
    - docker build -t $VALIDATOR validator/
    - docker push $VALIDATOR || (echo "Failed to push $VALIDATOR, retrying..." && sleep 5 && docker push $VALIDATOR)
    - docker build -t $LIGHTHOUSE lighthouse/
    - |
      # Show image size before pushing
      echo "Lighthouse image details:"
      docker images $LIGHTHOUSE --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
      IMAGE_SIZE=$(docker images $LIGHTHOUSE --format "{{.Size}}")
      echo "Image size: $IMAGE_SIZE"
    - |
      # Push lighthouse image with retry logic for large image
      echo "Pushing lighthouse image (this may take several minutes for large images)..."
      echo "Registry: $REGISTRY"
      echo "Testing registry connectivity..."
      curl -I "https://${REGISTRY}/v2/" 2>&1 | head -5 || echo "Warning: Could not reach registry API"
      
      # Configure Docker for chunked uploads (Docker Registry v2 uses chunked uploads)
      # This helps with large images through proxies like Traefik
      export DOCKER_BUILDKIT=0  # Disable BuildKit for compatibility
      
      # Try to use Docker's experimental features for better chunked upload handling
      # Set registry-specific timeout and retry settings
      MAX_RETRIES=3
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Push attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
        START_TIME=$(date +%s)
        
        # Use docker push with explicit progress output to see where it fails
        # The --quiet flag is NOT used to see progress and catch errors early
        if docker push $LIGHTHOUSE 2>&1 | tee /tmp/push.log; then
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "✓ Successfully pushed lighthouse image in ${DURATION}s"
          break
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          PUSH_ERROR=$(cat /tmp/push.log 2>/dev/null || echo "")
          
          # Check for specific error patterns
          if echo "$PUSH_ERROR" | grep -q "413\|Request Entity Too Large\|client_max_body_size"; then
            echo "✗ ERROR: 413 Request Entity Too Large detected!"
            echo "This indicates a proxy (Traefik/nginx) body size limit."
            echo ""
            echo "Traefik Configuration Required:"
            echo "1. Set maxRequestBodyBytes in Traefik middleware (>= 2GB):"
            echo "   traefik.http.middlewares.registry-body.buffering.maxRequestBodyBytes=2147483648"
            echo "2. Apply middleware to registry router"
            echo ""
            echo "OR in Traefik static config (traefik.yml):"
            echo "entryPoints:"
            echo "  websecure:"
            echo "    transport:"
            echo "      respondingTimeouts:"
            echo "        readTimeout: 30m"
            echo "        writeTimeout: 30m"
            echo "        idleTimeout: 5m"
          elif echo "$PUSH_ERROR" | grep -q "504\|Gateway Timeout\|timeout\|context canceled"; then
            echo "✗ ERROR: Timeout detected!"
            echo "Upload may be taking too long. Check proxy timeout settings."
            echo ""
            echo "Traefik Configuration Required:"
            echo "In traefik.yml (static config), set entrypoint timeouts:"
            echo "entryPoints:"
            echo "  websecure:"
            echo "    address: \":443\""
            echo "    transport:"
            echo "      respondingTimeouts:"
            echo "        readTimeout: 30m      # Critical for large uploads"
            echo "        writeTimeout: 30m"
            echo "        idleTimeout: 5m"
            echo ""
            echo "Also ensure Docker client timeout is set (already set to ${DOCKER_CLIENT_TIMEOUT}s)"
          elif echo "$PUSH_ERROR" | grep -q "connection reset\|broken pipe\|EOF\|unexpected EOF"; then
            echo "✗ ERROR: Connection reset detected!"
            echo "Network or proxy buffer issue. Check Traefik buffer settings."
            echo ""
            echo "Traefik Configuration Required:"
            echo "1. Increase buffer sizes in middleware:"
            echo "   maxRequestBodyBytes: 2147483648  # 2GB"
            echo "   maxResponseBodyBytes: 2147483648  # 2GB"
            echo "   memRequestBodyBytes: 10485760     # 10MB"
            echo "2. Check Traefik entrypoint timeouts (see timeout error above)"
            echo "3. Consider disabling buffering for registry (if Traefik supports it)"
          elif echo "$PUSH_ERROR" | grep -q "unauthorized\|authentication required"; then
            echo "✗ ERROR: Authentication issue detected!"
            echo "Token may have expired. Re-authenticating..."
          else
            echo "✗ ERROR: Unknown error during push"
            echo "Error details:"
            echo "$PUSH_ERROR" | tail -20
          fi
          
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            WAIT_TIME=$((RETRY_COUNT * 10))
            echo ""
            echo "⚠ Push failed, retrying in ${WAIT_TIME}s..."
            echo "Last error output:"
            tail -30 /tmp/push.log || true
            sleep $WAIT_TIME
            # Re-authenticate in case token expired
            echo "Re-authenticating with registry..."
            docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $REGISTRY
          else
            echo ""
            echo "✗ ERROR: Failed to push lighthouse image after $MAX_RETRIES attempts"
            echo ""
            echo "Image details:"
            docker images $LIGHTHOUSE --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" || docker images | grep lighthouse || true
            echo ""
            echo "Full error output:"
            cat /tmp/push.log || true
            echo ""
            echo "=========================================="
            echo "Troubleshooting Checklist:"
            echo "=========================================="
            echo ""
            echo "1. Traefik Middleware Configuration (Docker labels or dynamic config):"
            echo "   - maxRequestBodyBytes: 2147483648 (2GB) or larger"
            echo "   - maxResponseBodyBytes: 2147483648 (2GB) or larger"
            echo "   - memRequestBodyBytes: 10485760 (10MB)"
            echo ""
            echo "2. Traefik Entrypoint Timeouts (static config traefik.yml):"
            echo "   entryPoints:"
            echo "     websecure:"
            echo "       transport:"
            echo "         respondingTimeouts:"
            echo "           readTimeout: 30m"
            echo "           writeTimeout: 30m"
            echo "           idleTimeout: 5m"
            echo ""
            echo "3. GitLab Registry Configuration:"
            echo "   - Check registry['max_upload_size'] in /etc/gitlab/gitlab.rb"
            echo "   - Should be >= 10737418240 (10GB)"
            echo ""
            echo "4. Check Logs:"
            echo "   - Traefik: docker logs traefik | grep -i 'registry\|413\|timeout\|body'"
            echo "   - Registry: sudo gitlab-ctl tail registry | grep -i 'error\|413\|timeout'"
            echo ""
            echo "5. Test Registry Directly:"
            echo "   curl -I https://${REGISTRY}/v2/"
            echo ""
            echo "6. Note: Docker Registry v2 uses chunked uploads."
            echo "   Traefik must NOT buffer the entire request body."
            echo "   Consider using 'passHostHeader: true' and proper timeout settings."
            echo ""
            exit 1
          fi
        fi
      done

setupTest:
  stage: setupTest
  tags:
    - shellRunner
  script:
    - docker pull $TEST_IMAGE
    - docker network create $TEST_NETWORK
    - docker run -d --network $TEST_NETWORK
        --name $TEST_CONTAINER_NAME $TEST_IMAGE

testLinks:
  stage: test
  tags:
    - shellRunner
  script:
    - docker ps
    - docker run --rm --network $TEST_NETWORK $LINK_CHECKER
        http://$TEST_CONTAINER_NAME/ --check-extern

testHTML:
  stage: test
  tags:
    - shellRunner
  script:
    - docker run --volumes-from $TEST_CONTAINER_NAME $VALIDATOR
      --rm --verbose --skip-non-html /usr/share/nginx/html/

lighthouse:
  stage: lighthouse
  tags:
    - shellRunner
  script:
    - docker pull $LIGHTHOUSE
    - |
      # Run Lighthouse audit on the test container
      docker run --rm --network $TEST_NETWORK \
        -v $(pwd):/workspace \
        -w /workspace \
        $LIGHTHOUSE \
        http://$TEST_CONTAINER_NAME/ \
          --output=json \
          --output-path=/workspace/lighthouse-report.json \
          --chrome-flags='--headless --no-sandbox --disable-gpu' \
          --only-categories=performance,accessibility
    - |
      # Extract and validate scores
      PERFORMANCE=$(docker run --rm \
        --entrypoint sh \
        -v $(pwd):/workspace \
        -w /workspace \
        $LIGHTHOUSE -c "cat lighthouse-report.json | jq -r '.categories.performance.score * 100'")
      ACCESSIBILITY=$(docker run --rm \
        --entrypoint sh \
        -v $(pwd):/workspace \
        -w /workspace \
        $LIGHTHOUSE -c "cat lighthouse-report.json | jq -r '.categories.accessibility.score * 100'")
      echo "Performance score: $PERFORMANCE"
      echo "Accessibility score: $ACCESSIBILITY"
      echo "Thresholds: Performance >= $LIGHTHOUSE_PERFORMANCE_THRESHOLD, Accessibility >= $LIGHTHOUSE_ACCESSIBILITY_THRESHOLD"
      # Check thresholds (using awk for floating point comparison)
      if [ $(echo "$PERFORMANCE < $LIGHTHOUSE_PERFORMANCE_THRESHOLD" | awk '{print ($1 < $2)}') -eq 1 ]; then
        echo "ERROR: Performance score $PERFORMANCE is below threshold of $LIGHTHOUSE_PERFORMANCE_THRESHOLD"
        exit 1
      fi
      if [ $(echo "$ACCESSIBILITY < $LIGHTHOUSE_ACCESSIBILITY_THRESHOLD" | awk '{print ($1 < $2)}') -eq 1 ]; then
        echo "ERROR: Accessibility score $ACCESSIBILITY is below threshold of $LIGHTHOUSE_ACCESSIBILITY_THRESHOLD"
        exit 1
      fi
      echo "✓ All Lighthouse thresholds met!"
  artifacts:
    paths:
      - lighthouse-report.json
    expire_in: 30 days
  dependencies:
    - setupTest

cleanupTest:
  stage: cleanupTest
  tags:
    - shellRunner
  script:
    - docker stop $TEST_CONTAINER_NAME
        && docker rm $TEST_CONTAINER_NAME
    - docker network rm $TEST_NETWORK
  when: always

release:
  stage: release
  tags:
    - shellRunner
  script:
    - docker pull $TEST_IMAGE
    - docker tag $TEST_IMAGE $RELEASE_IMAGE
    - docker push $RELEASE_IMAGE
  only:
    - master
